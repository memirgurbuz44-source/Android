name: Android APK and Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Debug APK oluştur
        run: gradle --no-daemon assembleDebug
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Emir-Gurbuz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları yükle
        working-directory: windows
        run: npm install
      - name: Windows EXE oluştur
        working-directory: windows
        run: npm run dist
      - name: EXE dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Emir-Gurbuz-Windows
          path: windows/dist/*.exe
          if-no-files-found: error
