<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emir Gürbüz AI Studio</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#080c15;color:#edf3ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,#15304b 0,transparent 65%),radial-gradient(800px 500px at 100% 0,#21194a 0,transparent 60%),#080c15}
header{height:76px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16;background:#080c15cc}
.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.brand span{color:#5ddcff}.sub{color:#8998b1;font-size:12px}
main{max-width:1600px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(310px,.85fr) minmax(420px,1.45fr);gap:16px;height:calc(100vh - 76px)}
.panel{min-height:0;min-width:0;border:1px solid #26344a;background:#101827eF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 55px #0005}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead h2{font-size:12px;letter-spacing:1.4px;color:#8fa6c7;margin:0}
textarea{width:100%;min-height:145px;resize:vertical;background:#0a1220;border:1px solid #2b3c55;border-radius:11px;padding:14px;color:#f4f7ff;font:14px/1.6 inherit;outline:none}
textarea:focus{border-color:#42c9f0;box-shadow:0 0 0 3px #42c9f022}
button{border:1px solid #3a526e;border-radius:10px;padding:11px 14px;color:#edf7ff;background:#17283c;font-weight:700;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:#58d8ff;background:#1c3850}button:disabled{opacity:.48;cursor:not-allowed}
.primary{background:linear-gradient(110deg,#087da2,#5544a8);border-color:#43bce4;min-height:46px}.danger{background:#341d2a;border-color:#794055}
.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;color:#83eac2;font-size:12px;line-height:1.5}.hint{font-size:11px;color:#8190a8;line-height:1.5}
.editor{flex:1;min-height:180px;overflow:auto;margin:0;padding:14px;border-radius:10px;background:#080e18;border:1px solid #202e43;color:#c9e6ff;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 Consolas,monospace}
.previewPanel{padding:14px}.previewPanel iframe{display:block;width:100%;height:100%;min-height:400px;border:0;border-radius:10px;background:#fff;flex:1}
.previewPlaceholder{color:#6b7890;font:14px Segoe UI,Arial}
.pill{font-size:10px;color:#81e9c0;border:1px solid #2b6b5b;background:#103027;padding:5px 8px;border-radius:20px}
@media(max-width:900px){header{height:auto;min-height:68px;padding:14px 16px}main{height:auto;grid-template-columns:1fr;padding:12px}.panel{min-height:480px}.previewPanel{min-height:560px}.previewPanel iframe{min-height:470px}}
</style>
</head>
<body>
<header><div><div class="brand">✦ Emir Gürbüz <span>AI Studio</span></div><div class="sub">Yaz • Oluştur • Önizle</div></div><div class="sub">AI destekli kod üretici</div></header>
<main>
<section class="panel">
 <div class="panelhead"><h2>NE OLUŞTURMAK İSTİYORSUN?</h2><span class="pill">HTML / CSS / JS</span></div>
 <textarea id="prompt" placeholder="Örn: Modern, mobil uyumlu bir araba gösterge paneli oluştur. Hız, devir, yakıt ve vites göstergeleri çalışsın."></textarea>
 <div class="actions"><button class="primary" id="generate">✦ Tasarımı oluştur</button><button class="danger" id="stop" disabled>Durdur</button></div>
 <div class="hint">Kod geldikçe burada görünür. AI hizmeti için internet ve Puter hesabı gerekebilir.</div>
 <div class="status" id="status" role="status" aria-live="polite">Hazır. Ne yapmak istediğini yaz.</div>
 <div class="panelhead"><h2>OLUŞTURULAN KOD</h2><button id="copy">Kodu kopyala</button></div>
 <textarea class="editor" id="code" spellcheck="false" placeholder="Oluşturulan HTML kodu burada görünecek. İstersen düzenleyip Kodu çalıştır’a basabilirsin.">Henüz kod oluşturulmadı.</textarea>
</section>
<section class="panel previewPanel">
 <div class="panelhead"><h2>ÖNİZLEME</h2><div class="actions"><button id="runCode" class="primary">▶ Kodu çalıştır</button><span class="sub" id="previewState">Bekleniyor</span></div></div>
 <iframe id="preview" title="Oluşturulan tasarımın önizlemesi" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</section>
</main>
<script>
const promptBox=document.getElementById('prompt');
const generate=document.getElementById('generate');
const stopButton=document.getElementById('stop');
const status=document.getElementById('status');
const code=document.getElementById('code');
const preview=document.getElementById('preview');
const previewState=document.getElementById('previewState');
let generated='';
let controller=null;
let busy=false;
function cleanHTML(value){
 let html=String(value||'').trim();
 html=html.replace(/^`{3}(?:html)?\s*/i,'').replace(/\s*`{3}\s*$/,'').trim();
 const start=html.search(/<!doctype\s+html|<html[\s>]/i);
 if(start>0) html=html.slice(start);
 if(!html) throw new Error('AI boş yanıt verdi. Tekrar deneyebilirsin.');
 if(!/<html[\s>]/i.test(html) && !/<!doctype\s+html/i.test(html)){
   html='<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>'+html+'</body></html>';
 }
 return html;
}
function setBusy(value){
 busy=value;generate.disabled=value;stopButton.disabled=!value;
}
function renderPreview(html){
 preview.srcdoc=html;
 previewState.textContent='Önizleme güncellendi';
}
generate.addEventListener('click',async()=>{
 const idea=promptBox.value.trim();
 if(!idea){status.textContent='Önce ne oluşturmak istediğini yaz.';promptBox.focus();return;}
 if(busy)return;
 if(!window.puter?.ai?.chat){status.textContent='AI servisi yüklenemedi. Sayfayı yenileyip tekrar dene.';return;}
 controller=new AbortController();setBusy(true);
 generated='';code.value='AI yanıtı bekleniyor…';status.textContent='AI bağlanıyor…';previewState.textContent='Kod bekleniyor';
 const prompt=`Bir kıdemli web geliştiricisi gibi davran. Kullanıcının isteğini eksiksiz karşılayan, gerçekten çalışan bir web arayüzü üret.
Yalnızca tek dosyalık tam HTML döndür; CSS ve JavaScript aynı dosyada bulunsun.
Önce çalışan temel özellikleri yap, sonra görünümü güzelleştir. Butonları işlevsiz bırakma.
Gereksiz açıklama, Markdown çiti, büyük kütüphane ve gereksiz animasyon ekleme. Harici kütüphane gerekiyorsa kullanma; saf HTML/CSS/JS tercih et.
Mobil ve masaüstüne uyumlu, performanslı kod üret.
Kullanıcı isteği: ${idea}`;
 try{
   const stream=await puter.ai.chat(prompt,{model:'gpt-5.4-nano',stream:true,max_tokens:4096,temperature:0.35,signal:controller.signal});
   let raw='';
   for await(const part of stream){
     if(part?.type==='error') throw new Error(part.message||'AI yanıt üretirken hata oluştu.');
     if(part?.type==='text' && typeof part.text==='string') raw+=part.text;
     else if(typeof part?.text==='string' && !part.type) raw+=part.text;
     if(raw){code.value=raw;code.scrollTop=code.scrollHeight;status.textContent='Kod oluşturuluyor…';}
   }
   generated=cleanHTML(raw);
   code.value=generated;renderPreview(generated);
   try{localStorage.setItem('generated_html',generated);}catch(_){}
   status.textContent='Tamamlandı. Önizleme hazır.';
 }catch(error){
   const msg=error?.name==='AbortError'?'İşlem durduruldu.':(error?.message||String(error));
   status.textContent='Hata: '+msg;
   if(!generated && code.value==='AI yanıtı bekleniyor…')code.value='Kod üretilemedi.';
 }finally{controller=null;setBusy(false);}
});
stopButton.addEventListener('click',()=>{if(controller)controller.abort();});

document.getElementById('runCode').addEventListener('click',()=>{
 try{
   const html=cleanHTML(code.value);
   generated=html;
   code.value=html;
   renderPreview(html);
   try{localStorage.setItem('generated_html',html);}catch(_){}
   status.textContent='Kod çalıştırıldı. Önizleme güncellendi.';
 }catch(error){
   status.textContent='Önizleme hatası: '+(error?.message||String(error));
 }
});

document.getElementById('copy').addEventListener('click',async()=>{
 const text=code.value||generated;
 if(!text||text==='Henüz kod oluşturulmadı.')return;
 try{await navigator.clipboard.writeText(text);status.textContent='Kod kopyalandı.';}
 catch(_){status.textContent='Kopyalama izni yok. Kodu seçip Ctrl+C kullanabilirsin.';}
});
const saved=(()=>{try{return localStorage.getItem('generated_html')}catch(_){return null}})();
if(saved){generated=saved;code.value=saved;renderPreview(saved);status.textContent='Önceki tasarım yüklendi.';}
else{preview.srcdoc='<!doctype html><html><body style="margin:0;display:grid;place-items:center;height:100vh;font:15px Arial;color:#64748b">Oluşturduğun tasarım burada görünecek.</body></html>';}
</script>
</body></html>
